base_config:
- config/logging.yaml
- config/wandb.yaml
- config/model_sdv2.yaml

dataset:
  train:
    name: mlp_depth
    disp_name: mlp_prosthesis_train_kfold_5_4
    dir: ""
    filenames: /home/woody/iwnt/iwnt164h/mlp_dataset/prospthesisproject-Data/Code/data_split/kfold_5_4/train_list.txt
    resize_to_hw: [320, 448] # Reduced from [384, 512] to save memory
    eigen_valid_mask: false
  
  val:
    - name: mlp_depth
      disp_name: mlp_prosthesis_val_kfold_5_4
      dir: ""
      filenames: /home/woody/iwnt/iwnt164h/mlp_dataset/prospthesisproject-Data/Code/data_split/kfold_5_4/val_list.txt
      resize_to_hw: null
      eigen_valid_mask: false

  vis:
    - name: mlp_depth
      disp_name: mlp_prosthesis_vis_kfold_5_4
      dir: ""
      filenames: /home/woody/iwnt/iwnt164h/mlp_dataset/prospthesisproject-Data/Code/data_split/kfold_5_4/val_list.txt
      resize_to_hw: null
      eigen_valid_mask: false

pipeline:
  name: MarigoldDepthPipeline
  kwargs:
    scale_invariant: true
    shift_invariant: true
    default_denoising_steps: 4
    default_processing_resolution: 512

depth_normalization:
  type: scale_shift_depth
  clip: true
  norm_min: -1.0
  norm_max: 1.0
  min_max_quantile: 0.02

augmentation:
  lr_flip_p: 0.5

dataloader:
  num_workers: 2
  effective_batch_size: 8
  max_train_batch_size: 1
  seed: 2024

trainer:
  name: MarigoldDepthTrainer
  training_noise_scheduler:
    pretrained_path: stable-diffusion-2
  init_seed: 2024
  save_period: 100
  backup_period: 500
  validation_period: 999999
  visualization_period: 999999
  enable_gradient_checkpointing: true

multi_res_noise:
  strength: 0.9
  annealed: true
  downscale_strategy: original

gt_depth_type: depth_raw_norm
gt_mask_type: valid_mask_raw

max_epoch: 10000
max_iter: 3000

optimizer:
  name: AdamW8bit

loss:
  name: mse_loss
  kwargs:
    reduction: mean

lr: 3.0e-05
lr_scheduler:
  name: IterExponential
  kwargs:
    total_iter: 2500
    final_ratio: 0.01
    warmup_steps: 100

validation:
  denoising_steps: 1
  ensemble_size: 1
  processing_res: 0
  match_input_res: false
  resample_method: bilinear
  main_val_metric: abs_relative_difference
  main_val_metric_goal: minimize
  init_seed: 2024

eval:
  alignment: least_square
  align_max_res: null
  eval_metrics:
  - abs_relative_difference
  - squared_relative_difference
  - rmse_linear
  - rmse_log
  - log10
  - delta1_acc
  - delta2_acc
  - delta3_acc
  - i_rmse
  - silog_rmse

gradient_checkpointing: true

model:
  pretrained_path: stable-diffusion-2
  enable_xformers_memory_efficient_attention: true
